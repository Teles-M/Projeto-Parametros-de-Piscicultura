{% extends 'base.html' %}{% block title %}Cadastro · TambaTanqui{% endblock %}{% block content %}<div class="auth card"><div class="logo">🐟</div><p class="eyebrow">TAMBATANQUI</p><h1>Crie sua conta</h1><p class="muted">Cadastre-se para acompanhar seus tanques e sua produção.</p><form method="post"><label>Nome<input type="text" name="nome" value="{{ request.form.get('nome', '') }}" required></label><label>E-mail<input type="email" name="email" value="{{ request.form.get('email', '') }}" placeholder="voce@email.com" required></label><label>Senha<input id="senha" type="password" name="senha" minlength="6" required><span id="forca-senha" class="password-strength" aria-live="polite"></span></label><label>Confirme a senha<input type="password" name="confirmacao" minlength="6" required></label><button class="button full" type="submit">Criar minha conta</button></form><p class="muted">Já tem uma conta? <a href="{{ url_for('login') }}">Entrar</a></p></div><script>const senha = document.getElementById('senha'); const indicador = document.getElementById('forca-senha'); senha.addEventListener('input', () => { const valor = senha.value; const temMaiuscula = /[A-Z]/.test(valor); const temNumero = /\d/.test(valor); const temSimbolo = /[^A-Za-z0-9]/.test(valor); const previsivel = /^(.)\1+$|^(senha|password|123456)/i.test(valor); let nivel = 'fraca'; if (valor.length >= 10 && temMaiuscula && temNumero && temSimbolo) nivel = 'forte'; else if (valor.length >= 6 && temNumero && !previsivel) nivel = 'boa'; indicador.textContent = valor ? `Senha ${nivel}` : ''; indicador.className = `password-strength ${valor ? nivel : ''}`; });</script>{% endblock %}
