{% extends 'base.html' %}{% block title %}Novo tanque · TambaTanqui{% endblock %}{% block content %}<div class="form-card card"><p class="eyebrow">PRODUÇÃO</p><h1>Cadastrar tanque</h1><p class="muted">Adicione as informações iniciais do seu tanque.</p><form method="post" class="grid-form"><label>Nome do tanque<input name="nome" placeholder="Ex.: Tanque 01" required></label><label>Capacidade (litros)<input type="number" name="capacidade" min="1" step="0.01" required></label><label>Espécie<input name="especie" value="Tambaqui" required></label><label>Data de cadastro<input type="date" name="data_cadastro" value="{{ today }}" required></label><label>Quantidade inicial de peixes<input type="number" name="quantidade_inicial" min="0" required></label><div class="form-actions"><a href="{{ url_for('index') }}">Cancelar</a><button class="button" type="submit">Salvar tanque</button></div></form></div>{% endblock %}
