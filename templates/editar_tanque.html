{% extends 'base.html' %}{% block title %}Editar tanque · TambaTanqui{% endblock %}{% block content %}<div class="form-card card"><p class="eyebrow">PRODUÇÃO</p><h1>Editar tanque</h1><form method="post" class="grid-form"><label>Nome do tanque<input name="nome" value="{{ tanque.nome }}" required></label><label>Capacidade (litros)<input type="number" name="capacidade" min="1" step="0.01" value="{{ tanque.capacidade }}" required></label><label>Espécie<input name="especie" value="{{ tanque.especie }}" required></label><label>Data de cadastro<input type="date" name="data_cadastro" value="{{ tanque.data_cadastro }}" required></label><label>Quantidade inicial<input value="{{ tanque.quantidade_inicial }}" disabled></label><label>Quantidade atual<input type="number" name="quantidade_atual" min="0" value="{{ tanque.quantidade_atual }}" required></label><div class="parameter-fields"><h2>Parâmetros da água</h2><div class="grid-form"><label>Temperatura (°C)<input type="number" name="temperatura" min="0" step="0.1" value="{{ tanque.temperatura }}" required></label><label>pH<input type="number" name="ph" min="0" step="0.1" value="{{ tanque.ph }}" required></label><label>Oxigênio dissolvido (mg/L)<input type="number" name="oxigenio" min="0" step="0.1" value="{{ tanque.oxigenio }}" required></label><label>Amônia tóxica (mg/L)<input type="number" name="amonia" min="0" step="0.01" value="{{ tanque.amonia }}" required></label><label>Nitrito (mg/L)<input type="number" name="nitrito" min="0" step="0.01" value="{{ tanque.nitrito }}" required></label></div></div><div class="form-actions"><a href="{{ url_for('index') }}">Cancelar</a><button class="button" type="submit">Salvar alterações</button></div></form></div>{% endblock %}
